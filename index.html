<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://arte.eu.qlikcloud.com"
    data-client-id="019e8d5cbb34e31736201232f6779af7"
    data-redirect-uri="https://qlik-embed-test-ed7r.vercel.app/index.html"
    data-access-token-storage="session"
    data-auth-type="Oauth2"
    data-auto-redirect="true">
  </script>

  <script
    data-host="https://arte.eu.qlikcloud.com"
    src="https://cdn.jsdelivr.net/npm/@qlik/api@2/oauth-callback.iife.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .menu {
      height: 50px;
      padding: 10px;
      box-sizing: border-box;
      border-bottom: 1px solid #ddd;
    }

    .dashboard {
      width: 100%;
      height: calc(100vh - 50px);
    }

    .dashboard qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: calc(100vh - 50px);
      gap: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    .dashboard-item {
      min-width: 0;
      min-height: 0;
    }

    .dashboard-item qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }

    .samples-grid {
      display: grid;
      grid-template-rows: 3fr 1fr;
      width: 100%;
      height: calc(100vh - 50px);
      gap: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    .samples-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .samples-item {
      min-width: 0;
      min-height: 0;
    }

    .samples-item qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="menu">
    <select id="pageSelect">
      <option value="order-profits">Order Profits</option>
      <option value="customer-figures">Customer Figures</option>
      <option value="samples">Samples</option>
    </select>
  </div>

  <div id="page"></div>

  <script type="module">

    import {
      auth,
      qix
    } from "https://cdn.jsdelivr.net/npm/@qlik/api@2/index.min.js";


    const APP_ID = "a1bcf289-079b-4b4b-9cb7-eba889c13009";

    const activeSessions = new Map();


    auth.setDefaultHostConfig({
      host: "arte.eu.qlikcloud.com",
      authType: "Oauth2",
      clientId: "019e8d5cbb34e31736201232f6779af7",
      redirectUri: "https://qlik-embed-test-ed7r.vercel.app/index.html",
      accessTokenStorage: "session",
      autoRedirect: true
    });


    async function getSession(id) {
      if (activeSessions.has(id)) {
        return activeSessions.get(id);
      }

      const embed = document.getElementById(id);

      if (!embed) {
        throw new Error(`Qlik embed niet gevonden: ${id}`);
      }

      /*
        Zorg dat qlik-embed eerst zijn session opent.
        qlik-api/qix kan daarna dezelfde session hergebruiken.
      */
      await embed.getRefApi();

      const session = qix.openAppSession({
        appId: embed.getAttribute("app-id"),
        identity: embed.getAttribute("identity")
      });

      await session.getDoc();

      activeSessions.set(id, session);

      return session;
    }


    async function getDoc(id) {
      const session = await getSession(id);
      return await session.getDoc();
    }


    async function setVars(id, vars) {
      const doc = await getDoc(id);

      for (const [name, value] of Object.entries(vars)) {
        const variable = await doc.getVariableByName(name);
        await variable.setStringValue(value);
      }
    }


    async function clearSelections(id) {
      const doc = await getDoc(id);
      await doc.clearAll(true);
    }


    async function setSelections(id, selections) {
      const doc = await getDoc(id);

      for (const [fieldName, values] of Object.entries(selections)) {
        const field = await doc.getField(fieldName);

        await field.clear();

        await field.selectValues(
          (Array.isArray(values) ? values : [values])
            .map(value => ({ qText: value }))
        );
      }
    }


    async function closeCurrentSessions() {
      /*
        Eerst de embeds uit de DOM halen.
      */
      document.getElementById("page").innerHTML = "";

      const sessions = [...activeSessions.values()];

      activeSessions.clear();

      await Promise.allSettled(
        sessions.map(async session => {
          try {
            await session.close();
          } catch (error) {
            console.warn("Qlik session kon niet worden gesloten", error);
          }
        })
      );
    }


    async function showOrderProfitsPage() {
      document.getElementById("page").innerHTML = `
        <div class="dashboard">

          <qlik-embed
            id="order-profits"
            ui="analytics/sheet"
            app-id="${APP_ID}"
            sheet-id="zjthm"
            identity="order-profits"
            context___json='{"interactions":{"select":false}}'
            preview="true">
          </qlik-embed>

        </div>
      `;

      await customElements.whenDefined("qlik-embed");

      await getSession("order-profits");

      await clearSelections("order-profits");
    }


    async function showCustomerFiguresPage() {
      document.getElementById("page").innerHTML = `
        <div class="dashboard-grid">

          <div class="dashboard-item">
            <qlik-embed
              id="customer-trend"
              ui="analytics/chart"
              app-id="${APP_ID}"
              object-id="4adfbf24-a1eb-4f2d-b2da-9563c0bd9740"
              identity="customer-trend"
              context___json='{"interactions":{"select":false}}'
              preview="true">
            </qlik-embed>
          </div>

          <div class="dashboard-item">
            <qlik-embed
              id="customer-ranking-1"
              ui="analytics/chart"
              app-id="${APP_ID}"
              object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
              identity="customer-ranking-1"
              context___json='{"interactions":{"select":false}}'
              preview="true">
            </qlik-embed>
          </div>

          <div class="dashboard-item">
            <qlik-embed
              id="customer-table"
              ui="analytics/chart"
              app-id="${APP_ID}"
              object-id="248d8ec4-b20e-46d4-84a7-1a8a13629f4d"
              identity="customer-table"
              context___json='{"interactions":{"select":false}}'
              preview="true">
            </qlik-embed>
          </div>

          <div class="dashboard-item">
            <qlik-embed
              id="customer-ranking-2"
              ui="analytics/chart"
              app-id="${APP_ID}"
              object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
              identity="customer-ranking-2"
              context___json='{"interactions":{"select":false}}'
              preview="true">
            </qlik-embed>
          </div>

        </div>
      `;

      await customElements.whenDefined("qlik-embed");

      await Promise.all([
        getSession("customer-trend"),
        getSession("customer-ranking-1"),
        getSession("customer-table"),
        getSession("customer-ranking-2")
      ]);

      await Promise.all([
        clearSelections("customer-trend"),
        clearSelections("customer-ranking-1"),
        clearSelections("customer-table"),
        clearSelections("customer-ranking-2")
      ]);

      await Promise.all([

        setVars("customer-trend", {
          vTimeFrame: "All Time",
          vMeasCRM: "Delivered Turnover"
        }),

        setSelections("customer-trend", {
          Intercompany: "Non-Intercompany"
        }),


        setVars("customer-ranking-1", {
          vTimeFrame: "Current Year",
          vDyDimCrm: "Group Material",
          vMeasCRM: "Delivered Turnover"
        }),

        setSelections("customer-ranking-1", {
          Intercompany: "Non-Intercompany"
        }),


        setVars("customer-table", {
          vTimeFrame: "Current Year",
          vDyDimCrm: "Group Material",
          vMeasCRM: "Delivered Turnover"
        }),

        setSelections("customer-table", {
          Intercompany: "Non-Intercompany"
        }),


        setVars("customer-ranking-2", {
          vTimeFrame: "Current Year",
          vDyDimCrm: "Division",
          vMeasCRM: "Delivered Turnover"
        }),

        setSelections("customer-ranking-2", {
          Intercompany: "Non-Intercompany"
        })

      ]);
    }


    async function showSamplesPage() {
      document.getElementById("page").innerHTML = `
        <div class="samples-grid">

          <div class="samples-top">

            <div class="samples-item">
              <qlik-embed
                id="samples-pareto"
                ui="analytics/chart"
                app-id="${APP_ID}"
                object-id="d7d99717-a833-4f89-9b36-338c2a2a92d2"
                identity="samples-pareto"
                context___json='{"interactions":{"select":false}}'
                preview="true">
              </qlik-embed>
            </div>

            <div class="samples-item">
              <qlik-embed
                id="samples-ranking"
                ui="analytics/chart"
                app-id="${APP_ID}"
                object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
                identity="samples-ranking"
                context___json='{"interactions":{"select":false}}'
                preview="true">
              </qlik-embed>
            </div>

          </div>

          <div class="samples-item">
            <qlik-embed
              id="samples-trend"
              ui="analytics/chart"
              app-id="${APP_ID}"
              object-id="4adfbf24-a1eb-4f2d-b2da-9563c0bd9740"
              identity="samples-trend"
              context___json='{"interactions":{"select":false}}'
              preview="true">
            </qlik-embed>
          </div>

        </div>
      `;

      await customElements.whenDefined("qlik-embed");

      await Promise.all([
        getSession("samples-pareto"),
        getSession("samples-ranking"),
        getSession("samples-trend")
      ]);

      await Promise.all([
        clearSelections("samples-pareto"),
        clearSelections("samples-ranking"),
        clearSelections("samples-trend")
      ]);

      await Promise.all([

        setVars("samples-pareto", {
          vTimeFrame: "Current Month",
          vDyDimCrm: "Sold To Customer",
          vMeasCRM: "Quantity Samples Delivered"
        }),

        setSelections("samples-pareto", {
          Intercompany: "Non-Intercompany"
        }),


        setVars("samples-ranking", {
          vTimeFrame: "Current Month",
          vDyDimCrm: "Sold To Customer",
          vMeasCRM: "Quantity Samples Delivered"
        }),

        setSelections("samples-ranking", {
          Intercompany: "Non-Intercompany"
        }),


        setVars("samples-trend", {
          vTimeFrame: "All Time",
          vMeasCRM: "Quantity Samples Delivered"
        }),

        setSelections("samples-trend", {
          Intercompany: "Non-Intercompany"
        })

      ]);
    }


    async function showPage(page) {

      /*
        Sluit eerst alle sessions van de huidige pagina.
      */
      await closeCurrentSessions();


      if (page === "order-profits") {
        await showOrderProfitsPage();
      }

      if (page === "customer-figures") {
        await showCustomerFiguresPage();
      }

      if (page === "samples") {
        await showSamplesPage();
      }
    }


    document
      .getElementById("pageSelect")
      .addEventListener("change", async e => {
        await showPage(e.target.value);
      });


    /*
      Wanneer de volledige HTML-pagina wordt afgesloten
      (bijvoorbeeld Dynamics Web Resource sluiten),
      sluiten we de nog actieve sessions.
    */
    window.addEventListener("pagehide", () => {
      for (const session of activeSessions.values()) {
        try {
          session.close();
        } catch (error) {
          console.warn("Qlik session kon niet worden gesloten", error);
        }
      }

      activeSessions.clear();
    });


    showPage("order-profits");

  </script>

</body>
</html>
