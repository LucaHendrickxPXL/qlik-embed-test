<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://arte.eu.qlikcloud.com"
    data-client-id="019e8d5cbb34e31736201232f6779af7"
    data-redirect-uri="https://qlik-embed-test-ed7r.vercel.app/index.html"
    data-access-token-storage="session"
    data-auth-type="Oauth2"
    data-auto-redirect="true">
  </script>

  <script
    data-host="https://arte.eu.qlikcloud.com"
    src="https://cdn.jsdelivr.net/npm/@qlik/api@2/oauth-callback.iife.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .menu {
      height: 50px;
      padding: 10px;
      box-sizing: border-box;
      border-bottom: 1px solid #ddd;
    }

    .dashboard {
      width: 100%;
      height: calc(100vh - 50px);
    }

    .dashboard qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: calc(100vh - 50px);
      gap: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    .dashboard-item {
      min-width: 0;
      min-height: 0;
    }

    .dashboard-item qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }

    .samples-grid {
      display: grid;
      grid-template-rows: 3fr 1fr;
      width: 100%;
      height: calc(100vh - 50px);
      gap: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    .samples-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .samples-item {
      min-width: 0;
      min-height: 0;
    }

    .samples-item qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="menu">
    <select id="pageSelect">
      <option value="order-profits">Order Profits</option>
      <option value="customer-figures">Customer Figures</option>
      <option value="samples">Samples</option>
    </select>
  </div>

  <div id="page"></div>

  <script type="module">

    async function setVars(id, vars) {
      const embed = document.getElementById(id);
      const ref = await embed.getRefApi();
      const doc = await ref.getDoc();

      for (const [name, value] of Object.entries(vars)) {
        const variable = await doc.getVariableByName(name);
        await variable.setStringValue(value);
      }
    }

    async function setSelections(id, selections) {
  const embed = document.getElementById(id);
  const ref = await embed.getRefApi();
  const doc = await ref.getDoc();

  for (const [fieldName, values] of Object.entries(selections)) {
    const field = await doc.getField(fieldName);

    await field.clear();

    await field.selectValues(
      (Array.isArray(values) ? values : [values])
        .map(value => ({ qText: value }))
    );
  }
}


    async function showOrderProfitsPage() {
      document.getElementById("page").innerHTML = `
        <div class="dashboard">
          <qlik-embed
            id="order-profits"
            ui="analytics/sheet"
            app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
            sheet-id="zjthm"
            identity="order-profits"
            preview="true">
          </qlik-embed>
        </div>
      `;
    }


    async function showCustomerFiguresPage() {
      document.getElementById("page").innerHTML = `
        <div class="dashboard-grid">

          <div class="dashboard-item">
            <qlik-embed
              id="customer-trend"
              ui="analytics/chart"
              app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
              object-id="4adfbf24-a1eb-4f2d-b2da-9563c0bd9740"
              identity="customer-trend"
              preview="true">
            </qlik-embed>
          </div>

          <div class="dashboard-item">
            <qlik-embed
              id="customer-ranking-1"
              ui="analytics/chart"
              app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
              object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
              identity="customer-ranking-1"
              preview="true">
            </qlik-embed>
          </div>

          <div class="dashboard-item">
            <qlik-embed
              id="customer-table"
              ui="analytics/chart"
              app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
              object-id="248d8ec4-b20e-46d4-84a7-1a8a13629f4d"
              identity="customer-table"
              preview="true">
            </qlik-embed>
          </div>

          <div class="dashboard-item">
            <qlik-embed
              id="customer-ranking-2"
              ui="analytics/chart"
              app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
              object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
              identity="customer-ranking-2"
              preview="true">
            </qlik-embed>
          </div>

        </div>
      `;

      await customElements.whenDefined("qlik-embed");
      await Promise.all([
        clearSelections("customer-trend"),
        clearSelections("customer-ranking-1"),
        clearSelections("customer-table"),
        clearSelections("customer-ranking-2")
      ]);

      await Promise.all([
        setVars("customer-trend", {
          vTimeFrame: "All Time",
          vMeasCRM: "Delivered Turnover"
        }),
        setSelections("customer-trend", {
          Intercompany: "Non-Intercompany"
        }),

        setVars("customer-ranking-1", {
          vTimeFrame: "Current Year",
          vDyDimCrm: "Group Material",
          vMeasCRM: "Delivered Turnover"
        }),
        setSelections("customer-ranking-1", {
          Intercompany: "Non-Intercompany"
        }),

        setVars("customer-table", {
          vTimeFrame: "Current Year",
          vDyDimCrm: "Group Material",
          vMeasCRM: "Delivered Turnover"
        }),
        setSelections("customer-table", {
          Intercompany: "Non-Intercompany"
        }),

        setVars("customer-ranking-2", {
          vTimeFrame: "Current Year",
          vDyDimCrm: "Division",
          vMeasCRM: "Delivered Turnover"
        }),
        setSelections("ustomer-ranking-2", {
          Intercompany: "Non-Intercompany"
        })
      ]);
    }


    async function showSamplesPage() {
      document.getElementById("page").innerHTML = `
        <div class="samples-grid">

          <div class="samples-top">

            <div class="samples-item">
              <qlik-embed
                id="samples-pareto"
                ui="analytics/chart"
                app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
                object-id="d7d99717-a833-4f89-9b36-338c2a2a92d2"
                identity="samples-pareto"
                context___json='{"interactions":{"select":false}}'
                preview="true">
              </qlik-embed>
            </div>

            <div class="samples-item">
              <qlik-embed
                id="samples-ranking"
                ui="analytics/chart"
                app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
                object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
                identity="samples-ranking"
                preview="true">
              </qlik-embed>
            </div>

          </div>

          <div class="samples-item">
            <qlik-embed
              id="samples-trend"
              ui="analytics/chart"
              app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
              object-id="4adfbf24-a1eb-4f2d-b2da-9563c0bd9740"
              identity="samples-trend"
              preview="true">
            </qlik-embed>
          </div>

        </div>
      `;

      await customElements.whenDefined("qlik-embed");

      await Promise.all([
        clearSelections("samples-pareto"),
        clearSelections("samples-ranking"),
        clearSelections("samples-trend")
      ]);

      await Promise.all([
        setVars("samples-pareto", {
          vTimeFrame: "Current Month",
          vDyDimCrm: "Sold To Customer",
          vMeasCRM: "Quantity Samples Delivered"
        }),
        setSelections("samples-pareto", {
          Intercompany: "Non-Intercompany"
        }),

        setVars("samples-ranking", {
          vTimeFrame: "Current Month",
          vDyDimCrm: "Sold To Customer",
          vMeasCRM: "Quantity Samples Delivered"
        }),
        setSelections("samples-ranking", {
          Intercompany: "Non-Intercompany"
        }),

        setVars("samples-trend", {
          vTimeFrame: "All Time",
          vMeasCRM: "Quantity Samples Delivered"
        }),
        setSelections("samples-trend", {
          Intercompany: "Non-Intercompany"
        })
      ]);
      
    }


    async function showPage(page) {
      if (page === "order-profits") {
        await showOrderProfitsPage();
      }

      if (page === "customer-figures") {
        await showCustomerFiguresPage();
      }

      if (page === "samples") {
        await showSamplesPage();
      }
    }


    document.getElementById("pageSelect").addEventListener("change", async e => {
      await showPage(e.target.value);
    });

    showPage("order-profits");

  </script>

</body>
</html>
