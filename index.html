<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://arte.eu.qlikcloud.com"
    data-client-id="019e8d5cbb34e31736201232f6779af7"
    data-redirect-uri="https://qlik-embed-test-ed7r.vercel.app/index.html"
    data-access-token-storage="session"
    data-auth-type="Oauth2"
    data-auto-redirect="true">
  </script>

  <script
    data-host="https://arte.eu.qlikcloud.com"
    src="https://cdn.jsdelivr.net/npm/@qlik/api@2/oauth-callback.iife.js">
  </script>
</head>

<body>

  <qlik-embed
    id="chart-ytd"
    ui="analytics/chart"
    app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
    object-id="d7d99717-a833-4f89-9b36-338c2a2a92d2"
    identity="ytd"
    iframe="true"
    preview="true"
    identity="ytd">
  </qlik-embed>

  <qlik-embed
    id="chart-mtd"
    ui="analytics/chart"
    app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
    object-id="d7d99717-a833-4f89-9b36-338c2a2a92d2"
    identity="mtd"
    iframe="true"
    preview="true"
    identity="ytd">
  </qlik-embed>

<script type="module">
  async function setVar(id, name, value) {
    const ref = await document.getElementById(id).getRefApi();
    const doc = await ref.getDoc();
    await (await doc.getVariableByName(name)).setStringValue(value);
  }

  async function init() {
    await Promise.all([
      setVar("chart-ytd", "vTimeFrame", "Year To Date"),
      setVar("chart-ytd", "vDyDim1", "Sold To Customer"),
      setVar("chart-mtd", "vTimeFrame", "Month To Date"),
      setVar("chart-mtd", "vDyDim1", "Material")
    ]);
  }

  init();
</script>

</body>
</html>
