<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://arte.eu.qlikcloud.com"
    data-client-id="019e8d5cbb34e31736201232f6779af7"
    data-redirect-uri="https://qlik-embed-test-ed7r.vercel.app/index.html"
    data-access-token-storage="session"
    data-auth-type="Oauth2"
    data-auto-redirect="true">
  </script>

  <script
    data-host="https://arte.eu.qlikcloud.com"
    src="https://cdn.jsdelivr.net/npm/@qlik/api@2/oauth-callback.iife.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .menu {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .chart {
      width: 100%;
      height: 400px;
    }

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100%;
  height: calc(100vh - 50px);
  gap: 8px;
  padding: 8px;
  box-sizing: border-box;
}

.dashboard-item {
  min-width: 0;
  min-height: 0;
}

.dashboard-item qlik-embed {
  display: block;
  width: 100%;
  height: 100%;
}

    .chart qlik-embed,
    .dashboard qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="menu">
    <select id="pageSelect">
      <option value="order-profits">Order Profits</option>
      <option value="customer-figures">Customer Figures</option>
    </select>
  </div>

  <div id="page"></div>

  <script type="module">

    async function setVars(id, vars) {
      const ref = await document.getElementById(id).getRefApi();
      const doc = await ref.getDoc();

      for (const [name, value] of Object.entries(vars)) {
        await (await doc.getVariableByName(name)).setStringValue(value);
      }
    }
    async function showOrderProfitsPage() {
      document.getElementById("page").innerHTML = `
        <div class="dashboard">
          <qlik-embed
            id="order-profits"
            ui="analytics/sheet"
            app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
            sheet-id="zjthm"
            identity="order-profits"
            preview="true">
          </qlik-embed>
        </div>
      `;
    }
async function showOrderProfitsPage() {
  document.getElementById("page").innerHTML = `
    <div class="dashboard-grid">

      <div class="dashboard-item">
        <qlik-embed
          id="order-trend"
          ui="analytics/chart"
          app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
          object-id="4adfbf24-a1eb-4f2d-b2da-9563c0bd9740"
          identity="order-trend"
          preview="true">
        </qlik-embed>
      </div>

      <div class="dashboard-item">
        <qlik-embed
          id="order-ranking-1"
          ui="analytics/chart"
          app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
          object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
          identity="order-ranking-1"
          preview="true">
        </qlik-embed>
      </div>

      <div class="dashboard-item">
        <qlik-embed
          id="order-table"
          ui="analytics/chart"
          app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
          object-id="248d8ec4-b20e-46d4-84a7-1a8a13629f4d"
          identity="order-table"
          preview="true">
        </qlik-embed>
      </div>

      <div class="dashboard-item">
        <qlik-embed
          id="order-ranking-2"
          ui="analytics/chart"
          app-id="a1bcf289-079b-4b4b-9cb7-eba889c13009"
          object-id="039a7509-b334-48aa-b6c3-50e7da8c2904"
          identity="order-ranking-2"
          preview="true">
        </qlik-embed>
      </div>

    </div>
  `;

  await Promise.all([
    setVars("order-trend", {
      vTimeFrame: "All Time"
    }),

    setVars("order-ranking-1", {
      vTimeFrame: "Current Year",
      vDyDimCrm: "Group Material"
    }),

    setVars("order-table", {
      vTimeFrame: "Current Year",
      vDyDimCrm: "Group Material"
    }),

    setVars("order-ranking-2", {
      vTimeFrame: "Current Year",
      vDyDimCrm: "Division"
    })
  ]);
}

    async function showPage(page) {
      if (page === "order-profits") {
        await showOrderProfitsPage();
      }
      if (page === "customer-figures") {
        await showCustomerFiguresPage();
      }
    }

    document.getElementById("pageSelect").addEventListener("change", e => {
      showPage(e.target.value);
    });

    showPage("order-profits");

  </script>

</body>
</html>
